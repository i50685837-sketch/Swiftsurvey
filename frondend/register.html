<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwiftSurvey Register</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;


background:
linear-gradient(
rgba(0,50,20,0.55),
rgba(0,0,0,0.7)
),
url("people-shaking-hands.jpg");


background-size:cover;

background-position:center;

}



.container{

width:90%;

max-width:420px;

padding:40px;

border-radius:25px;


background:
rgba(255,255,255,0.12);


backdrop-filter:blur(15px);


border:1px solid rgba(255,255,255,0.3);


color:white;

}



h1{

text-align:center;

margin-bottom:30px;

}


h1 span{

color:#00ff88;

}



.input{

width:100%;

padding:15px;

margin:12px 0;

border:none;

outline:none;

border-radius:10px;

font-size:16px;

}



button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:30px;

background:#00ff88;

color:#003300;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:scale(1.05);

box-shadow:0 0 20px #00ff88;

}



.login{

text-align:center;

margin-top:20px;

}



.login a{

color:#00ff88;

text-decoration:none;

font-weight:bold;

}


</style>


</head>


<body>


<div class="container">


<h1>
Join <span>SwiftSurvey</span>
</h1>



<form onsubmit="registerUser(event)">



<input
id="name"
class="input"
type="text"
placeholder="Full Name"
required>



<input
id="email"
class="input"
type="email"
placeholder="Email Address"
required>



<input
id="phone"
class="input"
type="tel"
placeholder="Phone Number"
required>



<input
id="password"
class="input"
type="password"
placeholder="Create Password"
required>



<input
id="confirmPassword"
class="input"
type="password"
placeholder="Confirm Password"
required>



<button type="submit">

Create Account

</button>



</form>



<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>


</div>



<script src="js/auth.js"></script>


</body>

</html>
